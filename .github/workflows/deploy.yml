name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@4.3.2
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/__pycache__/**
            README.md
            .gitignore
            # The worker runs on the Mac Mini, not the web host. Copy it from
            # the repository; there is no reason for it to sit in the docroot.
            worker/**
