    <path d="M97.5 64 C97.5 36 79 7 50 1 L44 13.5 C70 20.5 88.5 41.5 94 58.5 Z"/>
    <path d="M40 30 L45 19.5 L47.3 22.6 L50 15.5 L54.4 24.2 L56.8 21 L60 30 Z"/>
    <g stroke="#8bc53f" stroke-linecap="butt" fill="none">
